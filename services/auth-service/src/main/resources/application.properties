# =========================================
# SERVER CONFIGURATION
# =========================================

server.port=8081

# =========================================
# CONFIG SERVER
# =========================================

spring.config.import=optional:configserver:http://config-server:8888

# =========================================
# APPLICATION CONFIGURATION
# =========================================

spring.application.name=auth-service

# =========================================
# DATABASE CONFIGURATION
# =========================================

spring.datasource.url=jdbc:postgresql://postgres:5432/auth_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================
# JPA CONFIGURATION
# =========================================

sspring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================================
# EUREKA CONFIGURATION
# =========================================

eureka.client.service-url.defaultZone=http://discovery-server:8761/eureka/

eureka.instance.prefer-ip-address=true

# =========================================
# ACTUATOR CONFIGURATION
# =========================================

management.endpoints.web.exposure.include=*


# =========================================
# JWT CONFIGURATION
# =========================================

application.security.jwt.secret-key=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9yRW50ZXJwcmlzZUFwcA==
application.security.jwt.expiration=86400000

# =========================================
# REDIS CONFIGURATION
# =========================================

spring.data.redis.host=redis
spring.data.redis.port=6379

# =========================================
# KAFKA CONFIGURATION
# =========================================

spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=auth-service-group

spring.kafka.consumer.auto-offset-reset=earliest