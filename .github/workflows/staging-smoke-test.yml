name: Staging Environment Smoke Test

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Publish Container Images"]
    types:
      - completed
    branches:
      - main

jobs:
  smoke-test:
    name: Docker Compose Staging Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package Service JARs for Local Compose Build
        run: ./mvnw clean package -DskipTests -B

      - name: Prepare Staging Environment Variables
        run: cp docker/compose/.env.example docker/compose/.env

      - name: Boot Docker Compose Mesh
        run: |
          docker compose -f docker/compose/docker-compose.yml up -d --build
          echo "Waiting 45s for infrastructure (PostgreSQL, Kafka, Eureka) to initialize..."
          sleep 45

      - name: Verify Eureka Service Discovery Registration
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8761/ || {
            echo "Eureka discovery server failed health check"
            docker compose -f docker/compose/docker-compose.yml logs discovery-server
            exit 1
          }

      - name: Verify Spring Cloud API Gateway Health
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:8080/actuator/health || {
            echo "API Gateway failed health check"
            docker compose -f docker/compose/docker-compose.yml logs api-gateway
            exit 1
          }

      - name: Verify React Frontend HTTP Response
        run: |
          curl --fail --retry 10 --retry-delay 5 --retry-connrefused http://localhost:3000/ || {
            echo "Frontend SPA failed HTTP probe"
            docker compose -f docker/compose/docker-compose.yml logs frontend
            exit 1
          }

      - name: Teardown Docker Compose Mesh
        if: always()
        run: docker compose -f docker/compose/docker-compose.yml down -v
