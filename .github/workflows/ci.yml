name: Platform Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-ci:
    name: Backend Reactor (Java 21 / Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build & Verify Multi-Module Maven Reactor
        run: |
          ./mvnw clean verify -B -V \
            -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn

      - name: Publish Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-test-reports
          path: |
            **/target/surefire-reports/*.txt
            **/target/surefire-reports/*.xml
          retention-days: 7

  frontend-ci:
    name: Frontend Application (Node 20 / React)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Lint Code
        run: npx oxlint || true

      - name: Build Production SPA Bundle
        run: npm run build

      - name: Archive Production Frontend Bundle
        uses: actions/upload-artifact@v4
        with:
          name: frontend-production-dist
          path: frontend/dist
          retention-days: 7

  compose-validation:
    name: Docker Compose Stack Syntax Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Copy .env.example to .env
        run: cp docker/compose/.env.example docker/compose/.env

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker/compose/docker-compose.yml config
