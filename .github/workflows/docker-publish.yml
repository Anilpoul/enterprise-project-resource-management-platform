name: Build & Publish Container Images

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-artifacts:
    name: Build Maven Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Package JAR Artifacts
        run: ./mvnw clean package -DskipTests -B

      - name: Archive Built JARs
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            infrastructure/*/target/*.jar
            services/*/target/*.jar
          retention-days: 1

  publish-images:
    name: Build & Push Image (${{ matrix.service }})
    needs: build-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: config-server
            context: .
            dockerfile: infrastructure/config-server/Dockerfile
          - service: discovery-server
            context: .
            dockerfile: infrastructure/discovery-server/Dockerfile
          - service: api-gateway
            context: .
            dockerfile: infrastructure/api-gateway/Dockerfile
          - service: auth-service
            context: .
            dockerfile: services/auth-service/Dockerfile
          - service: user-service
            context: .
            dockerfile: services/user-service/Dockerfile
          - service: organization-service
            context: .
            dockerfile: services/organization-service/Dockerfile
          - service: project-service
            context: .
            dockerfile: services/project-service/Dockerfile
          - service: task-service
            context: .
            dockerfile: services/task-service/Dockerfile
          - service: sprint-service
            context: .
            dockerfile: services/sprint-service/Dockerfile
          - service: resource-service
            context: .
            dockerfile: services/resource-service/Dockerfile
          - service: analytics-service
            context: .
            dockerfile: services/analytics-service/Dockerfile
          - service: notification-service
            context: .
            dockerfile: services/notification-service/Dockerfile
          - service: audit-service
            context: .
            dockerfile: services/audit-service/Dockerfile
          - service: frontend
            context: frontend
            dockerfile: frontend/Dockerfile

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download JAR Artifacts
        if: matrix.service != 'frontend'
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=ref,event=tag

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
