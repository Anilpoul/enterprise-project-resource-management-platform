apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: enterprise-platform
data:
  SPRING_PROFILES_ACTIVE: "prod"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://discovery-server.enterprise-platform.svc.cluster.local:8761/eureka/"
  SPRING_CONFIG_IMPORT: "optional:configserver:http://config-server.enterprise-platform.svc.cluster.local:8888"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: "kafka.enterprise-platform.svc.cluster.local:9092"
  SPRING_DATA_REDIS_HOST: "redis.enterprise-platform.svc.cluster.local"
  SPRING_DATA_REDIS_PORT: "6379"
  POSTGRES_HOST: "postgres.enterprise-platform.svc.cluster.local"
  POSTGRES_PORT: "5432"
