apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-server
  template:
    metadata:
      labels:
        app: config-server
    spec:
      containers:
        - name: config-server
          image: ghcr.io/enterprise-platform/config-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8888
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: config-server
  namespace: enterprise-platform
spec:
  selector:
    app: config-server
  ports:
    - port: 8888
      targetPort: 8888
