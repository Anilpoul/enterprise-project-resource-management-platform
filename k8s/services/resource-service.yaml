apiVersion: apps/v1
kind: Deployment
metadata:
  name: resource-service
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: resource-service
  template:
    metadata:
      labels:
        app: resource-service
    spec:
      containers:
        - name: resource-service
          image: ghcr.io/enterprise-platform/resource-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres.enterprise-platform.svc.cluster.local:5432/resource_db"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: resource-service
  namespace: enterprise-platform
spec:
  selector:
    app: resource-service
  ports:
    - port: 8087
      targetPort: 8087
