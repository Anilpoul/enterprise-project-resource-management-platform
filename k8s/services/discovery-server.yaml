apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-server
  namespace: enterprise-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-server
  template:
    metadata:
      labels:
        app: discovery-server
    spec:
      containers:
        - name: discovery-server
          image: ghcr.io/enterprise-platform/discovery-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-server
  namespace: enterprise-platform
spec:
  selector:
    app: discovery-server
  ports:
    - port: 8761
      targetPort: 8761
