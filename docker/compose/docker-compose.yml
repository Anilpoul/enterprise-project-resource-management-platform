services:

  # =========================================
  # POSTGRESQL
  # =========================================

  postgres:
    image: postgres:16

    container_name: enterprise-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - enterprise-network

  # =========================================
  # USER POSTGRESQL
  # =========================================

  user-postgres:
    image: postgres:16

    container_name: user-postgres

    environment:
      POSTGRES_DB: ${USER_DB}
      POSTGRES_USER: ${USER_DB_USER}
      POSTGRES_PASSWORD: ${USER_DB_PASSWORD}

    ports:
      - "${USER_POSTGRES_PORT}:5432"

    volumes:
      - user_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - enterprise-network

  # =========================================
  # REDIS
  # =========================================

  redis:
    image: redis:7

    container_name: enterprise-redis

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - enterprise-network

  # =========================================
  # ZOOKEEPER
  # =========================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1

    container_name: enterprise-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

    ports:
      - "2181:2181"

    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - enterprise-network

  # =========================================
  # KAFKA
  # =========================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1

    container_name: enterprise-kafka

    depends_on:
      zookeeper:
        condition: service_healthy

    ports:
      - "${KAFKA_PORT}:9092"
      - "29092:29092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

    networks:
      - enterprise-network

  # =========================================
  # CONFIG SERVER
  # =========================================

  config-server:
    build:
      context: ../../
      dockerfile: infrastructure/config-server/Dockerfile

    container_name: config-server

    ports:
      - "${CONFIG_SERVER_PORT}:8888"

    restart: unless-stopped

    networks:
      - enterprise-network

    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"

  # =========================================
  # DISCOVERY SERVER
  # =========================================

  discovery-server:
    build:
      context: ../../
      dockerfile: infrastructure/discovery-server/Dockerfile

    container_name: discovery-server

    depends_on:
      - config-server

    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"

    restart: unless-stopped

    networks:
      - enterprise-network

    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"

  # =========================================
  # API GATEWAY
  # =========================================

  api-gateway:
    build:
      context: ../../
      dockerfile: infrastructure/api-gateway/Dockerfile

    container_name: api-gateway

    depends_on:
      - config-server
      - discovery-server

    ports:
      - "${API_GATEWAY_PORT}:8080"

    restart: unless-stopped

    networks:
      - enterprise-network

    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379

  # =========================================
  # AUTH SERVICE
  # =========================================

  auth-service:
    build:
      context: ../../
      dockerfile: services/auth-service/Dockerfile

    container_name: auth-service

    depends_on:
      postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy
      redis:
        condition: service_started

    ports:
      - "${AUTH_SERVICE_PORT}:8081"

    restart: unless-stopped

    networks:
      - enterprise-network

    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

  # =========================================
  # USER SERVICE
  # =========================================

  user-service:
    build:
      context: ../../
      dockerfile: services/user-service/Dockerfile

    container_name: user-service

    depends_on:
      user-postgres:
        condition: service_healthy
      config-server:
        condition: service_started
      discovery-server:
        condition: service_started
      kafka:
        condition: service_healthy

    ports:
      - "${USER_SERVICE_PORT}:8082"

    restart: unless-stopped

    networks:
      - enterprise-network

    environment:
      JAVA_OPTS: "-Xms128m -Xmx256m"
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-postgres:5432/${USER_DB}
      SPRING_DATASOURCE_USERNAME: ${USER_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${USER_DB_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

  # =========================================
  # ORGANIZATION SERVICE
  # =========================================

  organization-service:
    build:
      context: ../../
      dockerfile: services/organization-service/Dockerfile

    container_name: organization-service

