version: '3.9'

services:

  # =========================================
  # POSTGRESQL
  # =========================================

  postgres:
    image: postgres:16

    container_name: enterprise-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql

    networks:
      - enterprise-network

  # =========================================
  # REDIS
  # =========================================

  redis:
    image: redis:7

    container_name: enterprise-redis

    ports:
      - "${REDIS_PORT}:6379"

    volumes:
      - redis_data:/data

    networks:
      - enterprise-network

  # =========================================
  # ZOOKEEPER
  # =========================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1

    container_name: enterprise-zookeeper

    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

    ports:
      - "2181:2181"

    networks:
      - enterprise-network

  # =========================================
  # KAFKA
  # =========================================

  kafka:
    image: confluentinc/cp-kafka:7.6.1

    container_name: enterprise-kafka

    depends_on:
      - zookeeper

    ports:
      - "${KAFKA_PORT}:9092"

    environment:
      KAFKA_BROKER_ID: 1

      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

    networks:
      - enterprise-network

  # =========================================
  # CONFIG SERVER
  # =========================================

  config-server:
    build:
      context: ../../infrastructure/config-server

    container_name: config-server

    ports:
      - "${CONFIG_SERVER_PORT}:8888"

    networks:
      - enterprise-network

  # =========================================
  # DISCOVERY SERVER
  # =========================================

  discovery-server:
    build:
      context: ../../infrastructure/discovery-server

    container_name: discovery-server

    depends_on:
      - config-server

    ports:
      - "${DISCOVERY_SERVER_PORT}:8761"

    networks:
      - enterprise-network

  # =========================================
  # API GATEWAY
  # =========================================

  api-gateway:
    build:
      context: ../../infrastructure/api-gateway

    container_name: api-gateway

    depends_on:
      - discovery-server

    ports:
      - "${API_GATEWAY_PORT}:8080"

    networks:
      - enterprise-network

  # =========================================
  # AUTH SERVICE
  # =========================================

  auth-service:
    build:
      context: ../../services/auth-service

    container_name: auth-service

    depends_on:
      - postgres
      - redis
      - kafka
      - discovery-server

    ports:
      - "${AUTH_SERVICE_PORT}:8081"

    networks:
      - enterprise-network

# =========================================
# VOLUMES
# =========================================

volumes:

  postgres_data:

  redis_data:

# =========================================
# NETWORKS
# =========================================

networks:

  enterprise-network: