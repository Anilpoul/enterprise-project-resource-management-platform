spring.application.name=api-gateway

server.port=8080

# =========================================
# CONFIG SERVER
# =========================================

spring.config.import=optional:configserver:http://localhost:8888

# =========================================
# EUREKA
# =========================================

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# =========================================
# REDIS
# =========================================

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# =========================================
# GATEWAY ROUTES
# =========================================

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Auth Service Route
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# User Service - Users
spring.cloud.gateway.routes[1].id=user-service-users
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/users/**

# User Service - Departments
spring.cloud.gateway.routes[2].id=user-service-departments
spring.cloud.gateway.routes[2].uri=lb://user-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/departments/**

# User Service - Designations
spring.cloud.gateway.routes[3].id=user-service-designations
spring.cloud.gateway.routes[3].uri=lb://user-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/designations/**

# Organization Service
spring.cloud.gateway.routes[4].id=organization-service
spring.cloud.gateway.routes[4].uri=lb://organization-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/v1/organizations/**

# Project Service
spring.cloud.gateway.routes[5].id=project-service
spring.cloud.gateway.routes[5].uri=lb://project-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/v1/projects/**

# Task Service
spring.cloud.gateway.routes[6].id=task-service
spring.cloud.gateway.routes[6].uri=lb://task-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/v1/tasks/**

# Sprint Service - Sprints
spring.cloud.gateway.routes[7].id=sprint-service-sprints
spring.cloud.gateway.routes[7].uri=lb://sprint-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/v1/sprints/**

# Sprint Service - Boards
spring.cloud.gateway.routes[8].id=sprint-service-boards
spring.cloud.gateway.routes[8].uri=lb://sprint-service
spring.cloud.gateway.routes[8].predicates[0]=Path=/api/v1/boards/**

# Resource Service
spring.cloud.gateway.routes[9].id=resource-service
spring.cloud.gateway.routes[9].uri=lb://resource-service
spring.cloud.gateway.routes[9].predicates[0]=Path=/api/v1/resources/**

# Analytics Service
spring.cloud.gateway.routes[10].id=analytics-service
spring.cloud.gateway.routes[10].uri=lb://analytics-service
spring.cloud.gateway.routes[10].predicates[0]=Path=/api/v1/analytics/**

# Notification Service
spring.cloud.gateway.routes[11].id=notification-service
spring.cloud.gateway.routes[11].uri=lb://notification-service
spring.cloud.gateway.routes[11].predicates[0]=Path=/api/v1/notifications/**

# Audit Service
spring.cloud.gateway.routes[12].id=audit-service
spring.cloud.gateway.routes[12].uri=lb://audit-service
spring.cloud.gateway.routes[12].predicates[0]=Path=/api/v1/audit/**


